<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selección Local 1 vs 1</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/character.css">
  <style>
    /* Expandir tarjeta para aprovechar el ancho */
    .selection-card {
      max-width: 1100px !important;
      width: 90%;
      margin: 20px auto;
      position: relative;
    }

    /* Layout lado a lado */
    .players-layout {
      display: flex;
      justify-content: space-around;
      gap: 30px;
      margin-bottom: 25px;
    }

    .player-selection-block {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .controls-hint {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 4px;
      margin-bottom: 15px;
    }

    /* Animaciones y Efectos de Brillo */
    .char-card {
      transition: all 0.25s ease-in-out;
      border: 2px solid transparent;
      cursor: pointer;
    }

    /* Navegación activa (Navegando con teclado) */
    .p1-card.highlight {
      border-color: #ff4444;
      box-shadow: 0 0 15px rgba(255, 68, 68, 0.6);
      transform: scale(1.05);
    }

    .p2-card.highlight {
      border-color: #4488ff;
      box-shadow: 0 0 15px rgba(68, 136, 255, 0.6);
      transform: scale(1.05);
    }

    /* Selección Confirmada (Brillo Intenso con Pulso) */
    .p1-card.selected {
      border-color: #ff2222 !important;
      background: rgba(255, 68, 68, 0.2) !important;
      box-shadow: 0 0 25px #ff2222, inset 0 0 15px #ff2222 !important;
      animation: pulse-p1 1.2s infinite alternate;
    }

    .p2-card.selected {
      border-color: #0066ff !important;
      background: rgba(68, 136, 255, 0.2) !important;
      box-shadow: 0 0 25px #0066ff, inset 0 0 15px #0066ff !important;
      animation: pulse-p2 1.2s infinite alternate;
    }

    @keyframes pulse-p1 {
      0% { box-shadow: 0 0 15px #ff2222, inset 0 0 10px #ff2222; }
      100% { box-shadow: 0 0 30px #ff4444, inset 0 0 20px #ff4444; }
    }

    @keyframes pulse-p2 {
      0% { box-shadow: 0 0 15px #0066ff, inset 0 0 10px #0066ff; }
      100% { box-shadow: 0 0 30px #4488ff, inset 0 0 20px #4488ff; }
    }

    /* Contenedor de Botones Inferiores */
    .actions-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-start-fight {
      min-width: 200px;
    }

    .btn-back {
      min-width: 150px;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .btn-back:hover {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="selection-card">
    <h2 class="title">Selección Local 1 vs 1</h2>

    <div class="players-layout">
      <!-- SELECCIÓN JUGADOR 1 -->
      <div class="player-selection-block">
        <h3 id="p1-title" style="color: #ff4444;">
          Jugador 1: <span id="p1-selected-name">GUERRERO</span>
        </h3>
        <div class="controls-hint">[A] Izq | [D] Der | [Espacio] Confirmar</div>
        <div class="characters-container">
          <div class="char-card p1-card" onclick="selectP1Index(0)" id="p1-card-warrior">
            <div class="char-avatar warrior-avatar"></div>
            <h4>Guerrero</h4>
          </div>
          <div class="char-card p1-card" onclick="selectP1Index(1)" id="p1-card-mage">
            <div class="char-avatar mage-avatar"></div>
            <h4>Mago</h4>
          </div>
          <div class="char-card p1-card" onclick="selectP1Index(2)" id="p1-card-archer">
            <div class="char-avatar archer-avatar"></div>
            <h4>Arquero</h4>
          </div>
        </div>
      </div>

      <!-- SELECCIÓN JUGADOR 2 -->
      <div class="player-selection-block">
        <h3 id="p2-title" style="color: #4488ff;">
          Jugador 2: <span id="p2-selected-name">GUERRERO</span>
        </h3>
        <div class="controls-hint">[←] Izq | [→] Der | [Enter] Confirmar</div>
        <div class="characters-container">
          <div class="char-card p2-card" onclick="selectP2Index(0)" id="p2-card-warrior">
            <div class="char-avatar warrior-avatar"></div>
            <h4>Guerrero</h4>
          </div>
          <div class="char-card p2-card" onclick="selectP2Index(1)" id="p2-card-mage">
            <div class="char-avatar mage-avatar"></div>
            <h4>Mago</h4>
          </div>
          <div class="char-card p2-card" onclick="selectP2Index(2)" id="p2-card-archer">
            <div class="char-avatar archer-avatar"></div>
            <h4>Arquero</h4>
          </div>
        </div>
      </div>
    </div>

    <!-- BOTONES ACOMODADOS DEBAJO -->
    <div class="actions-container">
      <button id="btn-start-fight" class="btn-start-fight" onclick="confirmSelection()" disabled>
        ¡PELEAR!
      </button>
      <button class="btn-back" onclick="location.href='index.html'">Volver</button>
    </div>
  </div>

  <script>
    const characterList = ['warrior', 'mage', 'archer'];

    let p1Index = 0;
    let p2Index = 0;

    let selectedP1 = null;
    let selectedP2 = null;

    function updateP1Highlight() {
      document.querySelectorAll('.p1-card').forEach(card => card.classList.remove('highlight', 'selected'));
      const currentChar = characterList[p1Index];

      if (selectedP1) {
        document.getElementById(`p1-card-${selectedP1}`).classList.add('selected');
      } else {
        document.getElementById(`p1-card-${currentChar}`).classList.add('highlight');
        document.getElementById('p1-selected-name').innerText = currentChar.toUpperCase();
      }
    }

    function updateP2Highlight() {
      document.querySelectorAll('.p2-card').forEach(card => card.classList.remove('highlight', 'selected'));
      const currentChar = characterList[p2Index];

      if (selectedP2) {
        document.getElementById(`p2-card-${selectedP2}`).classList.add('selected');
      } else {
        document.getElementById(`p2-card-${currentChar}`).classList.add('highlight');
        document.getElementById('p2-selected-name').innerText = currentChar.toUpperCase();
      }
    }

    function selectP1Index(index) {
      p1Index = index;
      selectedP1 = characterList[p1Index];
      document.getElementById('p1-selected-name').innerText = selectedP1.toUpperCase() + " (LISTO)";
      updateP1Highlight();
      checkCanStart();
    }

    function selectP2Index(index) {
      p2Index = index;
      selectedP2 = characterList[p2Index];
      document.getElementById('p2-selected-name').innerText = selectedP2.toUpperCase() + " (LISTO)";
      updateP2Highlight();
      checkCanStart();
    }

    function checkCanStart() {
      const btn = document.getElementById('btn-start-fight');
      if (selectedP1 && selectedP2) {
        btn.removeAttribute('disabled');
      } else {
        btn.setAttribute('disabled', 'true');
      }
    }

    function confirmSelection() {
      if (selectedP1 && selectedP2) {
        window.location.href = `local_game.html?p1=${selectedP1}&p2=${selectedP2}`;
      }
    }

    // --- MANEJO DE TECLAS ---
    window.addEventListener('keydown', (e) => {
      // JUGADOR 1: A / D / Espacio
      if (!selectedP1) {
        if (e.code === 'KeyA') {
          p1Index = (p1Index - 1 + characterList.length) % characterList.length;
          updateP1Highlight();
        } else if (e.code === 'KeyD') {
          p1Index = (p1Index + 1) % characterList.length;
          updateP1Highlight();
        } else if (e.code === 'Space') {
          e.preventDefault();
          selectP1Index(p1Index);
        }
      }

      // JUGADOR 2: Flechas Izq/Der / Enter
      if (!selectedP2) {
        if (e.code === 'ArrowLeft') {
          p2Index = (p2Index - 1 + characterList.length) % characterList.length;
          updateP2Highlight();
        } else if (e.code === 'ArrowRight') {
          p2Index = (p2Index + 1) % characterList.length;
          updateP2Highlight();
        } else if (e.code === 'Enter') {
          e.preventDefault();
          selectP2Index(p2Index);
        }
      }

      // Iniciar pelea tras confirmación doble
      if (selectedP1 && selectedP2 && (e.code === 'Enter' || e.code === 'Space')) {
        confirmSelection();
      }
    });

    // Inicializar resaltados al cargar
    updateP1Highlight();
    updateP2Highlight();
  </script>
</body>
</html>
