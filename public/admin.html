<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel Admin - Evento Especial</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/menu.css">
  <style>
    /* Estilos específicos para el Panel de Administración sin perder la estética */
    .admin-card {
      width: 100%;
      max-width: 550px;
      padding: 25px;
      box-sizing: border-box;
    }

    .admin-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .admin-header h1 {
      color: #ffca28;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 10px 0;
      text-shadow: 0 0 8px rgba(255, 202, 40, 0.4);
    }

    .status-dashboard {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid #444;
      border-radius: 6px;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 14px;
      gap: 8px;
      flex-direction: column;
    }

    .status-badge {
      color: #00e5ff;
      font-weight: bold;
    }

    .count-badge {
      background: #ff4444;
      color: #fff;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: bold;
    }

    .admin-players-container {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      max-height: 220px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .admin-players-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .admin-players-list li {
      padding: 8px 12px;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .admin-players-list li:nth-child(even) {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .admin-players-list li:last-child {
      border-bottom: none;
    }

    .player-id-tag {
      font-size: 11px;
      color: #888;
      font-family: monospace;
    }

    .btn-start-event {
      background-color: #ff4444;
      color: #fff;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .btn-start-event:hover:not(:disabled) {
      background-color: #ff6666;
    }

    .btn-start-event:disabled {
      background-color: #444;
      color: #888;
      cursor: not-allowed;
      border-color: #333;
    }

    /* Estilo estilizado para el botón de cerrar sesión en admin */
    .btn-logout-admin {
      width: 100%;
      margin-top: 15px;
      background-color: #d9534f;
      border: 1px solid #b52b27;
    }

    .btn-logout-admin:hover {
      background-color: #c9302c;
    }
  </style>
</head>
<body>
  <!-- PANTALLA PRINCIPAL ADMIN -->
  <div class="screen active">
    
    <div class="menu-card admin-card">
      
      <div class="admin-header">
        <h1>CONTROL DE EVENTO ESPECIAL</h1>
        <p class="status-message" style="margin: 0;">Panel Administrador de Torneo Eliminatorio</p>
      </div>

      <!-- DASHBOARD DE ESTADO -->
      <div class="status-dashboard">
        <span>Estado: <span id="event-status" class="status-badge">Esperando jugadores</span></span>
        <span>Conectados: <span id="player-count" class="count-badge">0</span></span>
      </div>

      <!-- LISTA DE JUGADORES EN SALA DE ESPERA -->
      <div class="players-list-container admin-players-container">
        <h4>Jugadores en Sala de Espera:</h4>
        <ul id="admin-players-list" class="admin-players-list">
          <!-- Se completa dinámicamente -->
        </ul>
      </div>

      <!-- ACCIONES DE ADMINISTRACIÓN -->
      <button id="btn-start-event" class="btn-option btn-action btn-start-event" disabled>
        🚀 INICIAR TORNEO ELIMINATORIO
      </button>

      <p id="admin-system-msg" class="status-message" style="margin-top: 15px; min-height: 18px;"></p>

      <!-- BOTÓN CERRAR SESIÓN ESTILIZADO -->
      <button id="btn-logout-admin" class="btn-option btn-back btn-logout-admin" onclick="logoutAdmin()">
        CERRAR SESIÓN
      </button>

    </div>

  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // 1. Obtener el token guardado en el login
    const token = localStorage.getItem('token');

    // Redirigir al inicio si no hay token
    if (!token) {
      alert('Debes iniciar sesión como administrador.');
      window.location.href = 'index.html';
    }

    // --- FUNCIÓN PARA CERRAR SESIÓN DESDE ADMIN ---
    function logoutAdmin() {
      localStorage.removeItem('token');
      localStorage.removeItem('usuario');
      window.location.href = 'index.html';
    }

    // Detecta host
    const SERVER_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:3000'
      : 'https://juego-en-desarrollo.onrender.com';

    // 2. Conectar Socket.io enviando el token para seguridad
    const socket = io(SERVER_URL, {
      auth: { token: token }
    });

    const playerCountEl = document.getElementById('player-count');
    const playersListEl = document.getElementById('admin-players-list');
    const btnStartEvent = document.getElementById('btn-start-event');
    const eventStatusEl = document.getElementById('event-status');
    const systemMsgEl = document.getElementById('admin-system-msg');

    // Al conectar, registrarse como administrador
    socket.on('connect', () => {
      systemMsgEl.textContent = 'Conectado al servidor como Administrador.';
      socket.emit('registerAdmin');
    });

    // Error de permisos o autenticación
    socket.on('connect_error', (err) => {
      alert('Error de acceso: ' + err.message);
      window.location.href = 'index.html';
    });

    // Escuchar actualización constante de jugadores
    socket.on('updateSpecialEventLobby', (players) => {
      playerCountEl.textContent = players.length;
      playersListEl.innerHTML = '';

      if (players.length === 0) {
        const emptyLi = document.createElement('li');
        emptyLi.textContent = 'Sin jugadores en espera...';
        emptyLi.style.color = '#888';
        playersListEl.appendChild(emptyLi);
      } else {
        players.forEach((player, index) => {
          const li = document.createElement('li');
          li.innerHTML = `
            <span><b>#${index + 1}</b> ${player.name}</span>
            <span class="player-id-tag">ID: ${player.id.substring(0, 6)}...</span>
          `;
          playersListEl.appendChild(li);
        });
      }

      btnStartEvent.disabled = players.length < 2;
    });

    // Confirmación de inicio
    socket.on('specialEventStartedSuccess', () => {
      eventStatusEl.textContent = 'EN CURSO';
      eventStatusEl.style.color = '#00e5ff';
      systemMsgEl.textContent = '¡Torneo lanzado con éxito! Las llaves han sido distribuidas.';
      btnStartEvent.disabled = true;
    });

    // Iniciar torneo
    btnStartEvent.addEventListener('click', () => {
      if (confirm('¿Deseas iniciar el Evento Especial con los jugadores conectados?')) {
        systemMsgEl.textContent = 'Iniciando evento... Generando cuadro eliminatorio.';
        socket.emit('adminStartSpecialEvent');
      }
    });

    socket.on('disconnect', () => {
      systemMsgEl.textContent = 'Conexión perdida con el servidor. Reconectando...';
    });
  </script>

</body>
</html>
